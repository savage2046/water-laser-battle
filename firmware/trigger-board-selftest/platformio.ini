; PlatformIO Project Configuration File
;
; trigger-board-selftest —— triger-sensor 正式板（ESP32-C3-WROOM-02-N4）硬件自检固件
;
;   目标硬件是原生 USB 的正式板（IO18/IO19 直连 Type-C，无 UART 桥），
;   因此默认环境 esp32c3 开启 USB CDC（Serial 走 USB-Serial-JTAG）。
;   若手头是带 UART 桥的 C3 开发板（如 ESP32-C3-DevKitM-1 板载桥），
;   用 esp32c3-uart 环境（Serial 走 UART0 = IO20/21，桥接串口可见）。
;
; 烧录/监视示例：
;   pio run -e esp32c3 -t upload        # 正式板（默认）
;   pio run -e esp32c3-uart -t upload   # UART 桥开发板
;   pio device monitor -b 115200

[platformio]
default_envs = esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:esp32c3]
; triger-sensor 正式板 / 原生 USB 的最小系统板（IO18/19 = USB）
board = esp32-c3-devkitm-1
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3-uart]
; 带 UART 桥的 C3 开发板：Serial = UART0（IO21 TX / IO20 RX），
; 板载桥接芯片后串口监视器即可看到输出。
board = esp32-c3-devkitm-1
build_flags =
  -D CORE_DEBUG_LEVEL=1
