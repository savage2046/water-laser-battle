; PlatformIO Project Configuration File
;
; triger-sensor.eprj2 正式检测板固件（独立工程）
;   主控：ESP32-C3-WROOM-02-N4（4MB flash，原生 USB-C = IO18/IO19）
;   传感器：INA226（I2C IO4/IO5，地址 0x40，分流电阻 2mΩ）
;   执行：IO3 → UCC27517 → 20N03（断电开关）
;   LED：IO0（高电平点亮）
;
; 编译： pio run -e esp32c3
; 烧录： pio run -e esp32c3 -t upload      （USB-C 原生 USB，免 CH340）
; 串口： pio device monitor -e esp32c3 -b 115200

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
upload_speed = 921600
build_flags =
  -D CORE_DEBUG_LEVEL=2
