; PlatformIO Project Configuration File
;
; lora-gwtest —— 枪端主控板充当「LoRa 网关」的 470MHz 链路测试固件
;
;   目标硬件：gun-board.eprj2 / 板子 main 上安装的 LCKFB-ESP32S3R8N8
;   （ESP32-S3，DIP-40，丝印 Gxx = GPIOxx）；射频同 U2 Ra-01S / SX1268。
;   与正式固件 firmware/gun、firmware/gateway 互不干扰：刷入本固件即进入
;   「LoRa 网关测试」模式，测试完成后重新烧录正式固件即可。
;
;   与 gun-selftest 的关系：gun-selftest 只做开机一次性体检（T1 LED / T2 模块
;   在位 / T3 ESP-NOW）；本固件专门测 470MHz LoRa 链路，复用同一套引脚，
;   但把射频跑起来（SCAN/MON/GW/PING/ECHO 五种模式）。
;
;   当前实现（见 src/）：
;     config.h      引脚 / 射频参数 / TDMA 时隙常量 / 测试帧类型 / 统计规模
;     Stats.*       统计：每设备 RSSI/SNR/PER/到达间隔/时隙偏移/注册时延
;                   + 全局收发计数 / TX 空口耗时 / Ping-Pong RTT / 频点质量
;     LoRaTest.*    射频引擎（FreeRTOS 任务，core1 优先级 5；事件环形缓冲）
;                   SCAN 20 频点扫描 | MON 被动监听 | GW TDMA 网关
;                   PING 主动测试 | ECHO 应答器
;     main.cpp      开机自检报告 / 串口命令 / 板载 LED / 5s 心跳 / 逐帧日志
;
; 烧录 / 监视（方式与 firmware/gun 相同）：
;   pio run -e esp32s3 -t upload
;   pio device monitor -b 115200

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 复用仓库共享 TDMA 帧协议（firmware/lib/tdma/TdmaProto）：测试固件用同一份
; 编码/解码（10B 定长 + CRC-8/ATM），保证与正式固件在帧层面 100% 兼容。
lib_extra_dirs =
  ../lib
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  jgromes/RadioLib@^6.5.0
