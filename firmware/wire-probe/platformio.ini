; ============================================================================
; wire-probe —— 只有一个功能：开机后 4 个管脚持续输出固定频率的方波
;
;     NSS  =   10 Hz
;     SCK  =  100 Hz
;     MOSI =  500 Hz
;     RST  = 1000 Hz
;
; 不用 SPI、不用任何库；四路由同一个 4kHz 硬件定时器分频产生（相位对齐、
; 频率精确、与主循环无关）。烧进去用示波器直接量即可。
;
;   枪端主板 / 网关板（两者接线相同，2026-09-12 起）：pio run -e gun-s3 -t upload
; ============================================================================

[platformio]
default_envs = gun-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0

; ---- 枪端主板 / 网关板（ESP32-S3，DIP-40；丝印 Gxx = GPIOxx）----
;      2026-09-12 起网关板改用与枪端相同的接线 → 两块板都烧这个 env
[env:gun-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_GUN_S3=1 -D ARDUINO_USB_CDC_ON_BOOT=1
