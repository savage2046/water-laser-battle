; ============================================================================
; spi-read —— 第二步：通过 SPI 读 SX126x 的寄存器/参数，打印到串口
;
;   读法全部按数据手册 §13：
;     GetStatus        0xC0 + NOP                -> 状态字节（芯片模式/命令状态）
;     GetPacketType    0x11 + NOP                -> 0x00 GFSK / 0x01 LoRa
;     ReadRegister     0x1D + 地址(2B) + N×NOP   -> N 字节数据
;     GetDeviceErrors  0x17 + NOP + NOP          -> 2 字节错误标志
;
;   开机先给一次复位脉冲，因此读到的应是**手册表 12-1 的复位默认值**：
;     0x0740=0x14  0x0741=0x24  0x08AC=0x94  0x0911=0x05  0x0912=0x05
;   —— 这就是"SPI 到底读对了没有"的硬判据。
;
;   默认寄存器：0x0320（版本串 SX1268）/ 0x0740、0x0741（LoRa 同步字）/
;              0x08AC（RxGain）/ 0x08E7（OCP）/ 0x0911、0x0912（XTA/XTB trim）/
;              0x0819（随机数，用来确认"读"是真的）
;
;   串口命令：a=立刻打印  l=自动打印开关  s=SPI 时钟换档（1/2/4/8/16MHz）
;             0740        读 1 字节
;             0320.16     读 16 字节
;
;   枪端主板 / 网关板（2026-09-12 起两者接线相同）：pio run -e gun-s3 -t upload
; ============================================================================

[platformio]
default_envs = gun-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0

; ---- 枪端主板 / 网关板（ESP32-S3，DIP-40；丝印 Gxx = GPIOxx）----
;      2026-09-12 起网关板改用与枪端相同的接线 → 两块板都烧这个 env
[env:gun-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_GUN_S3=1 -D ARDUINO_USB_CDC_ON_BOOT=1
