; ============================================================================
; lora-tx —— 只发不收：SX1268 LoRa 470MHz 发送端
;
;   上电：复位 → 配置（含 ★0x9D 01：DIO2 驱动模组 RF 开关）→ 每秒自动发一包 "LRTESTnn"
;   对端烧 lora-rx（只收）。两边射频参数完全一致。
;
;   命令字节（DS_SX1262.pdf §13，源码里每条都标了表号）：
;     SetStandby  0x80 00              SetPacketType 0x8A 01 (LoRa)
;     ★SetDio2AsRfSwitchCtrl 0x9D 01  ← 漏发这条：TX_DONE 正常但空口什么都不辐射
;     SetRfFrequency 0x86 1D600000     470.000MHz
;     SetModulationParams 0x8B 07 06 01 00   SF7 / BW500k / CR4-5 / LDRO off
;     SetPacketParams 0x8C 0004 00 08 01 00  preamble4 / explicit / len8 / CRC on / IQ std
;     SetBufferBaseAddress 0x8F 00 00   WriteBuffer 0x0E 00 <8B>
;     SetTx 0x83 000000                GetIrqStatus 0x12 -> TxDone(bit0)
;
;   串口命令：t 发一包 | T 自动发开关 | p 周期 | a 状态 | r 重新配置 | s SPI 时钟
;             <地址>[.<n>] 读寄存器 | h 帮助
;
;   枪端主板 / 网关板（2026-09-12 起两者接线相同）：pio run -e gun-s3 -t upload
; ============================================================================

[platformio]
default_envs = gun-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0

; ---- 枪端主板 / 网关板（ESP32-S3，DIP-40；丝印 Gxx = GPIOxx）----
;      2026-09-12 起网关板改用与枪端相同的接线 → 两块板都烧这个 env
[env:gun-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_GUN_S3=1 -D ARDUINO_USB_CDC_ON_BOOT=1
