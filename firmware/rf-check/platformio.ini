; ============================================================================
; rf-check —— LoRa 模组体检固件（SX1268 / Ra-01S，裸 SPI，不用 RadioLib）
;
;   目的：区分「**模组没焊接好**」与「**模组本身坏了**」。
;   上电自动跑 9 项检查，之后可用单键复测（详见 README.md 的判读表）：
;     [1] 复位 + BUSY 行为        → RST/BUSY 线焊接
;     [2] 芯片身份（版本串 0x0320）→ 模组是否在位、是不是 SX1268
;     [3] 寄存器写回环（0x0740/41）→ MOSI/MISO 是否双向通
;     [4] 状态字节 ×8             → 芯片是否稳定应答
;     [5] GetDeviceErrors         → XOSC / PLL / PA 斜坡 / 校准（**模组自身损坏**）
;     [6] RSSI 噪声底（20 点）     → 接收链路 + 天线
;     [7] 发一帧                  → TX_DONE / 空口时间 / 误差位 / DIO1 有无翻转
;     [8] 连发 10 帧              → 配 lora-rx 对端判读"到底辐射出去没有"
;     [9] 连收 10 秒              → 配 lora-tx 对端判读"收得到吗"、RSSI/SNR
;
;   串口命令：s 全部重跑 | t 连发10帧 | r 连收10秒 | w 写回环 | e 清错误
;             f<MHz> 换频点 | i 状态 | h 帮助
;
;   烧录（枪端板 / 网关板接线相同）：pio run -e gun-s3 -t upload
;   串口输出全 ASCII（避免编码问题），判读表见 README.md
; ============================================================================

[platformio]
default_envs = gun-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0

[env:gun-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_GUN_S3=1 -D ARDUINO_USB_CDC_ON_BOOT=1
