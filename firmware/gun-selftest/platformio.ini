; PlatformIO Project Configuration File
;
; gun-selftest —— 枪端主控板硬件体检 + LoRa 联机联调固件
;
;   目标硬件：枪端主控板（gun-board.eprj2 / 板子 main）上安装的
;   LCKFB-ESP32S3R8N8 模组（ESP32-S3，DIP-40，丝印 Gxx = GPIOxx）。
;   与正式固件 firmware/gun 互不干扰：刷入本固件即进入体检/联调模式，
;   完成后重新烧录正式固件即可恢复正常工作。
;
;   当前实现（见 src/main.cpp）：
;     T1  板载 LED（GPIO48）闪烁 —— 模组上电/时钟/Flash/烧录链路 + 结果灯
;     T2  LoRa 模块连接（U2 Ra-01S / SX1268，CS=G16 SCK=G42 MOSI=G15
;         MISO=G41 RST=G46 BUSY=G45）—— RadioLib begin + 版本寄存器自检
;     T3  ESP-NOW 自动连接（src/EspNowAuto.*）—— NVS 记忆 + 扫描选最强
;     T4  ★ LoRa 网关自动连接 + 每秒心跳（src/LoRaDev.*）
;           扫 20 个标准频点找网关信标 → 注册槽发 JOIN → 收 TF_ASSIGN
;           → 之后每 1000ms 在自身时隙发一个 TF_HB
;     T5  ★ 940nm/38kHz 光路矫正发射（src/IrAlign.*）
;           每 1000ms 发一帧最低功率的编码信号（近距 G47 / 远距 G13 可选）
;
; 复用仓库共享 TDMA 帧协议（firmware/lib/tdma/TdmaProto）：T4 的 JOIN/HB/ASSIGN
; 与正式固件是同一份编解码代码，保证帧层面完全兼容。
;
; 烧录 / 监视（与 firmware/gun 相同方式）：
;   pio run -e esp32s3 -t upload
;   pio device monitor -b 115200

[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
  ../lib
lib_deps =
  jgromes/RadioLib@^6.5.0

[env:esp32s3]
board = esp32-s3-devkitm-1
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
