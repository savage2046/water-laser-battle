; PlatformIO Project Configuration File
;
; gun-selftest —— 枪端主控板硬件体检固件
;
;   目标硬件：枪端主控板（gun-board.eprj2 / 板子 main）上安装的
;   LCKFB-ESP32S3R8N8 模组（ESP32-S3，DIP-40，丝印 Gxx = GPIOxx）。
;   与正式固件 firmware/gun 互不干扰：刷入本固件即进入体检模式，
;   体检完成后重新烧录正式固件即可恢复正常工作。
;
;   当前实现（见 src/main.cpp）：
;     T1  板载 LED（GPIO48，丝印 G48）1Hz 闪烁 —— 确认模组上电、时钟、Flash、代码运行正常
;     T2  LoRa 模块连接（U2 Ra-01S / SX1268，SPI G42/G15/G41 + CS=G16、RST=G46、BUSY=G45）
;        —— RadioLib begin + SPI 寄存器自检：判 PASS/FAIL，串口打印原因
;     T3  ESP-NOW 自动连接（src/EspNowAuto.*）—— 先连上次成功地址(NVS)，
;        3s 未连上则 promiscuous 抓包扫描 RSSI 选最强探测；成功后保存地址
;
; 烧录 / 监视（与 firmware/gun 相同方式）：
;   pio run -e esp32s3 -t upload
;   pio device monitor -b 115200

[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^6.5.0

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
