; espnow-verify：ESP-NOW 信号验证固件（接收电流检测板信号）
; 默认烧录 esp32s3（与检测板 PCB 一致）；手头只有经典 ESP32 用 -e esp32dev
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1
