; ============================================================================
; lora-rx —— 第三步：把 SX1268 配置成 LoRa 470MHz 并进入连续接收，打印 RSSI
;
;   配置序列（全部按 DS_SX1262.pdf §13，参数编码见各表的出处注释）：
;     1) SetStandby          0x80 00                 -> STDBY_RC
;     2) SetPacketType       0x8A 01                 -> LoRa
;     3) SetRfFrequency      0x86 1D 60 00 00        -> 470.000MHz（RfFreq=freq*2^25/32e6）
;     4) SetModulationParams 0x8B 07 06 01 00        -> SF7 / BW500k / CR4-5 / LDRO off
;     5) SetPacketParams     0x8C 0004 00 08 01 00   -> 前导4 / 显式头 / 最大载荷8 / CRC开 / 标准IQ
;     6) SetRx               0x82 FF FF FF           -> 连续接收
;
;   读回验证：GetPacketType 应为 0x01(LoRa)、GetStatus 模式字段应为 0x5(RX)、err 应为 0；
;   然后每秒打印瞬时 RSSI（dBm = -raw/2）+ 收包 / CRC错 / 包头错 计数（GetStats）。
;   RSSI 无信号时约 -100 ~ -125dBm；把对端发射凑近，数字会明显跳起来。
;
;   串口命令：a=立刻打印  l=每秒打印开关  r=重新配置并进接收  s=SPI 时钟换档
;             <地址> / <地址>.<n> = 读寄存器（带原始字节回显）  h=帮助
;
;   枪端主板 / 网关板（2026-09-12 起两者接线相同）：pio run -e gun-s3 -t upload
; ============================================================================

[platformio]
default_envs = gun-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0

; ---- 枪端主板 / 网关板（ESP32-S3，DIP-40；丝印 Gxx = GPIOxx）----
;      2026-09-12 起网关板改用与枪端相同的接线 → 两块板都烧这个 env
[env:gun-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_GUN_S3=1 -D ARDUINO_USB_CDC_ON_BOOT=1
