; ============================================================================
; spi-probe v2 —— ESP32 ↔ LoRa(SX1268 / Ra-01S) SPI 接口测试固件（极简版）
;
; 只做一件事：把 **SPI 接口本身** 测清楚 —— 波形有没有、干不干净、芯片答不答。
;
;   · 上电什么都不发，只停在空闲态（NSS=高 SCK=低 MOSI=低 RST=高），
;     不自动跑任何自检、不连续灌数据 → 示波器上永远是干净基线。
;   · 按键才发，而且一次只发**一个完整帧**：NSS 拉低 → 8/16/19 个时钟 →
;     NSS 拉高 → 帧间隔空档（默认 100ms）。触发点明确（NSS 下降沿）。
;   · 时钟默认 250kHz（1 时钟 4µs），示波器能逐位看清；按 s 提速。
;   · 串口输出纯 ASCII（无中文，任何终端都不会乱码），连续模式每秒一行。
;
; 不依赖 RadioLib，只用 Arduino 核心 + SPI。
;
; 烧录（两种板二选一）：
;   枪端主板（ESP32-S3）：pio run -e gun-s3 -t upload
;   网关板（ESP32 经典）：pio run -e gw-esp32 -t upload
;   串口监视：pio device monitor -b 115200
;
; 上电后按 4 或 5 发一帧，示波器用 SINGLE 触发（NSS 下降沿）先看波形，
; 再看串口打印的应答字节 —— 判定链：波形有没有 → 干不干净 → 芯片答不答。
; ============================================================================

[platformio]
default_envs = gun-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0

; ---- 枪端主板 / 网关板（ESP32-S3；2026-09-12 起两者接线相同，都用这个 env）----
[env:gun-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_GUN_S3=1 -D ARDUINO_USB_CDC_ON_BOOT=1
