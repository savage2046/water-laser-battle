; ============================================================
; calibration-target 校准靶板固件（ESP32-S3，板卡按 PCB/calibration-target/calibration-target.eprj2）
;   15× XL-IRM-V838M3/TR(38k/940nm) 接收 + 15× WS2812C-2020-V6 RGB 指示（灯串 GPIO41→74HCT1G125→5V）
;   收到 940nm(38k) 信号 → 该格 LED 红；未收到 → 绿
; ============================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=2
  -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
lib_deps =
  fastled/FastLED@^3.6.0
